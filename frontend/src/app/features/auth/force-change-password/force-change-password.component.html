<main class="c-auth">
  <section class="c-auth__card">
    <header class="c-auth__header">
      <h1 class="c-auth__logo">🔒 Cambio de contraseña</h1>
      <p class="c-auth__subtitle">Por seguridad, debes establecer una nueva contraseña</p>
    </header>
    <div class="c-auth__body">
      <h2 class="c-auth__title">Nueva contraseña</h2>
      <form class="c-form" (ngSubmit)="onSubmit()">
        <div class="c-form__group">
          <label class="c-form__label" for="currentPassword">Contraseña actual (la que recibiste por email)</label>
          <input
            id="currentPassword"
            type="password"
            class="c-form__input"
            [class.c-form__input--error]="error()"
            placeholder="Contraseña temporal"
            [(ngModel)]="currentPassword"
            name="currentPassword"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="c-form__group">
          <label class="c-form__label" for="newPassword">Nueva contraseña</label>
          <input
            id="newPassword"
            type="password"
            class="c-form__input"
            [class.c-form__input--error]="error()"
            placeholder="Mínimo 6 caracteres"
            [(ngModel)]="newPassword"
            name="newPassword"
            autocomplete="new-password"
            required
          />
        </div>
        <div class="c-form__group">
          <label class="c-form__label" for="confirmPassword">Confirmar nueva contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            class="c-form__input"
            [class.c-form__input--error]="error()"
            placeholder="Repite la nueva contraseña"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            required
          />
        </div>
        <p class="c-form__error" *ngIf="error()">{{ error() }}</p>
        <p class="c-form__success" *ngIf="success()" style="color: #48bb78; font-size: 0.875rem; margin-bottom: 0.75rem;">{{ success() }}</p>
        <button type="submit" class="c-button c-button--full c-button--lg" [disabled]="loading()">
          <span class="c-button__spinner" *ngIf="loading()"></span>
          {{ loading() ? 'Cambiando...' : 'Cambiar contraseña' }}
        </button>
      </form>
    </div>
    <footer class="c-auth__footer">
      <p>¿Problemas? <a class="c-auth__link" style="cursor: pointer;" (click)="logout()">Cerrar sesión</a></p>
    </footer>
  </section>
</main>
